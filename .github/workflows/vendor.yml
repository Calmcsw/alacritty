name: Bundle Offline Alacritty

on:
  workflow_dispatch:

jobs:
  vendor:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p .cargo
          cargo vendor > .cargo/config.toml
          tar --exclude='.git' -czf ../alacritty-offline.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: alacritty-offline
          path: ../alacritty-offline.tar.gz
