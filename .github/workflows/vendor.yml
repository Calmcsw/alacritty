name: Bundle Offline Alacritty

on:
  workflow_dispatch:

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Alacritty
        uses: actions/checkout@v4

      - name: Vendor all Cargo crates
        run: |
          mkdir -p .cargo
          cargo vendor > .cargo/config.toml
          tar --exclude='.git' -czf ../alacritty-offline.tar.gz .

      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: alacritty-offline
          path: ../alacritty-offline.tar.gz
